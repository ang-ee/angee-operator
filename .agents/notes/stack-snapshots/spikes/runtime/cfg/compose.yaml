name: angee-spike-rt
services:
  # Save shape: the payload is the container's stdout; chatter goes to stderr.
  dump:
    image: alpine:3
    volumes:
      - <scratchpad>/spikes/runtime/data:/data:ro
    environment:
      PAYLOAD: /data/p64
    command:
      - sh
      - -c
      - 'echo "container-stderr-before" >&2; cat "$$PAYLOAD"; echo "container-stderr-after" >&2; sha256sum "$$PAYLOAD" >&2'
  # Restore shape: the payload is the container's stdin; the hash goes to stderr.
  restore:
    image: alpine:3
    command:
      - sh
      - -c
      - 'echo "restore-start" >&2; sha256sum >&2; echo "restore-done" >&2'
  # Generic: run whatever command the caller passes after the service name.
  sh:
    image: alpine:3
    volumes:
      - <scratchpad>/spikes/runtime/data:/data:ro
  # Pull case: an image that is removed before each run.
  pulled:
    image: busybox:1.36.1
    volumes:
      - <scratchpad>/spikes/runtime/data:/data:ro
    command:
      - sh
      - -c
      - 'echo "pulled-stderr" >&2; cat /data/p64'
