name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"

permissions:
  contents: read

jobs:
  # ── Stage 1: cheap static checks (fail fast) ─────────────────────────
  static:
    name: gofmt + vet + tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat the following files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum drift after 'go mod tidy':"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

  # ── Stage 2: golangci-lint ───────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m

  # ── Stage 3: tests on linux + macos with race detector ──────────────
  test:
    name: test (${{ matrix.os }})
    needs: static
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Test (race + coverage)
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
        continue-on-error: true

  # ── Stage 3b: jj driver tests against the pinned jj ─────────────────
  # jj slots need `jj workspace add --colocate`, which only jj main has, so
  # jj is built from the commit in .github/jj-rev (bump it deliberately) and
  # cached by that commit. ANGEE_REQUIRE_JJ=1 makes the jj integration tests
  # fail, instead of skip, when jj or the capability is missing.
  test-jj:
    name: test (jj)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Read the pinned jj commit
        id: jj
        run: |
          rev=$(tr -d '[:space:]' < .github/jj-rev)
          if ! printf '%s' "$rev" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::.github/jj-rev must hold one full jj commit id, not '$rev'"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Restore jj
        id: jj-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.jj-ci
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.rev }}

      - name: Build jj
        if: steps.jj-cache.outputs.cache-hit != 'true'
        env:
          JJ_REV: ${{ steps.jj.outputs.rev }}
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install --git https://github.com/jj-vcs/jj --rev "$JJ_REV" \
            --locked --root "$HOME/.jj-ci" --bin jj jj-cli

      # Saved as soon as it is built, so a failing test does not throw the
      # build away.
      - name: Save jj
        if: steps.jj-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.jj-ci
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Put jj on PATH
        run: |
          echo "$HOME/.jj-ci/bin" >> "$GITHUB_PATH"
          "$HOME/.jj-ci/bin/jj" --version

      - name: Test the jj driver
        env:
          ANGEE_REQUIRE_JJ: "1"
        run: go test -race ./internal/vcs/... ./internal/service/...

      # The template fixtures must be what the pinned jj prints: regenerate
      # them and fail on any difference.
      - name: Template fixtures match the pinned jj
        run: |
          go test -count=1 -run TestTemplateFixtures ./internal/vcs/jjdriver -update
          git diff --exit-code -- internal/vcs/jjdriver/testdata

  # ── Stage 4: cross-compile sanity check ─────────────────────────────
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [static, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build operator
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags="-s -w" \
            -o "dist/angee-operator-${{ matrix.os }}-${{ matrix.arch }}${EXT}" \
            ./cmd/operator

      - name: Build CLI
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags="-s -w" \
            -o "dist/angee-${{ matrix.os }}-${{ matrix.arch }}${EXT}" \
            ./cmd/angee

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  # ── Stage 5: vulnerability scan (govulncheck) ────────────────────────
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Run govulncheck directly instead of via golang/govulncheck-action.
      # The action conflicts with actions/setup-go's git auth ("Duplicate
      # header: Authorization") on PR runs as of v6 of setup-go.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ── Stage 6: Docker images (no push) ─────────────────────────────────
  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.operator
          push: false
          tags: ghcr.io/ang-ee/angee-operator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cli
          push: false
          tags: ghcr.io/ang-ee/angee-cli:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
